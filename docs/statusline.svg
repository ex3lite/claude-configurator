<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Claude Configurator status bar</title>
  <desc id="desc">A Claude-style terminal status bar showing model, repository, branch, context remaining, five-hour and seven-day limits, and reset countdowns.</desc>
  <rect width="1200" height="210" rx="20" fill="#141413"/>
  <rect x="1" y="1" width="1198" height="208" rx="19" fill="none" stroke="#383835" stroke-width="2"/>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="34" y="53" fill="#e7e6e1" font-size="22">❯</text>
    <rect x="60" y="30" width="12" height="28" rx="2" fill="#898781"/>
    <line x1="30" y1="78" x2="1170" y2="78" stroke="#52514e" stroke-width="2"/>

    <text x="34" y="119" fill="#d97757" font-size="18" font-weight="700">Fable 5</text>
    <text x="125" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="149" y="119" fill="#8b8078" font-size="18">kakadu-ai</text>
    <text x="270" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="294" y="119" fill="#678f69" font-size="18">git:main</text>
    <text x="397" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="421" y="119" fill="#678f69" font-size="18">ctx:97% left</text>
    <text x="568" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="592" y="119" fill="#7c7774" font-size="18">17:18</text>
    <text x="670" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="694" y="119" fill="#678f69" font-size="18">5h:64% left · ↻1h42m</text>
    <text x="938" y="119" fill="#7c7774" font-size="18">|</text>
    <text x="962" y="119" fill="#678f69" font-size="18">7d:84% · ↻3d4h</text>

    <text x="34" y="163" fill="#7c7774" font-size="18">↳</text>
    <text x="66" y="163" fill="#8b8078" font-size="18">effort:xhigh</text>
    <text x="212" y="163" fill="#7c7774" font-size="18">·</text>
    <text x="235" y="163" fill="#8b8078" font-size="18">thinking:on</text>
    <text x="373" y="163" fill="#7c7774" font-size="18">·</text>
    <text x="396" y="163" fill="#8b8078" font-size="18">agent:researcher</text>
  </g>
</svg>
