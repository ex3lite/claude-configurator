name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**/*.png"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/claude-config
      - if: runner.os != 'Windows'
        run: sh -n scripts/install.sh scripts/release-notes.sh scripts/render-social-preview.sh scripts/update-screenshots.sh scripts/update-live-screenshot.sh scripts/render-statusline-demo.sh
      - if: runner.os == 'Linux'
        run: |
          latest_tag="$(awk '/^## v/{print $2; exit}' CHANGELOG.md)"
          ./scripts/release-notes.sh "$latest_tag" > "$RUNNER_TEMP/release-notes.md"
          grep -q "^## Verification$" "$RUNNER_TEMP/release-notes.md"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("scripts/install.ps1", "scripts/smoke-release.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List
              exit 1
            }
          }
